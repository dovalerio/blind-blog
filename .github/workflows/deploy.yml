name: CI/CD — blind-blog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ────────────────────────────────────────────────────────
  # CI — Segurança e estilo (executa em todos os pushes/PRs)
  # ────────────────────────────────────────────────────────
  security:
    name: "CI — Segurança (Brakeman + Bundler Audit)"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.11'
          bundler-cache: true
          working-directory: app

      - name: Brakeman — análise estática de segurança Rails
        run: bundle exec brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: Bundler Audit — CVEs em dependências
        run: bundle exec bundler-audit check --update

  lint:
    name: "CI — Lint (RuboCop)"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.11'
          bundler-cache: true
          working-directory: app

      - name: Cache RuboCop
        uses: actions/cache@v4
        with:
          path: app/${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ hashFiles('app/.ruby-version', 'app/**/.rubocop.yml', 'app/Gemfile.lock') }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ hashFiles('app/.ruby-version', 'app/**/.rubocop.yml', 'app/Gemfile.lock') }}-

      - name: RuboCop — estilo de código
        run: bundle exec rubocop --parallel -f github

  # ────────────────────────────────────────────────────────
  # CD — Deploy (somente push na main, após CI aprovado)
  # ────────────────────────────────────────────────────────
  deploy:
    name: "CD — Deploy DigitalOcean"
    runs-on: ubuntu-latest
    needs: [security, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="/home/deploy/apps/blind-blog"
            BACKUP_TS=$(date +%Y%m%d_%H%M%S)
            BACKUP_DIR="$HOME/backups/blind-blog"

            # ── 0. Validar variáveis obrigatórias no .env ──────────────
            echo "▶ [0/5] Validando .env..."
            REQUIRED="RAILS_ENV SECRET_KEY_BASE"
            MISSING=""
            for var in $REQUIRED; do
              grep -q "^${var}=" "$APP_DIR/.env" 2>/dev/null || MISSING="$MISSING $var"
            done
            if [ -n "$MISSING" ]; then
              echo "❌ ERRO: variáveis obrigatórias ausentes no .env:$MISSING"
              echo "   Atualize $APP_DIR/.env antes do próximo deploy."
              exit 1
            fi
            echo "   .env OK"

            # ── 1. Backup do .env atual ────────────────────────────────
            echo "▶ [1/5] Backup..."
            mkdir -p "$BACKUP_DIR"
            cp "$APP_DIR/.env" "$BACKUP_DIR/.env.$BACKUP_TS"
            echo "   Backup em: $BACKUP_DIR/.env.$BACKUP_TS"

            # ── 2. Sincronizar código com origin/main ──────────────────
            echo "▶ [2/5] Sincronizando código (git reset --hard origin/main)..."
            cd "$APP_DIR"
            git remote set-url origin https://github.com/dovalerio/blind-blog.git
            git fetch --prune origin
            git reset --hard origin/main
            echo "   Commit: $(git log --oneline -1)"

            # ── 3. Build e deploy com Docker Compose ──────────────────
            echo "▶ [3/5] Docker Compose build + deploy..."
            docker compose up -d --build --remove-orphans

            # ── 4. Limpeza de imagens antigas ─────────────────────────
            echo "▶ [4/5] Removendo imagens obsoletas..."
            docker image prune -f

            # ── 5. Health check com retentativas ──────────────────────
            echo "▶ [5/5] Health check (aguardando app inicializar)..."
            sleep 30
            RETRIES=6
            for i in $(seq 1 $RETRIES); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: blog.dovalerio.me" http://127.0.0.1:3001/up 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "   ✅ Health check OK (HTTP $STATUS) na tentativa $i/$RETRIES"
                break
              fi
              echo "   Tentativa $i/$RETRIES — HTTP $STATUS. Aguardando 15s..."
              [ "$i" = "$RETRIES" ] && echo "   ❌ FALHA: app não respondeu após $RETRIES tentativas" && exit 1
              sleep 15
            done

            echo ""
            echo "🚀 Deploy concluído com sucesso!"
            echo "   App:    https://blog.dovalerio.me"
            echo "   Commit: $(git log --oneline -1)"
